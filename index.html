<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中國象棋 · Three.js 3D</title>
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>中國象棋</h1>
      <span class="sub">THREE.JS · 3D 互動棋盤 · 雙人对弈</span>
    </div>
    <div id="hud">
      <div id="turn"><span id="turnDot"></span><span id="turnText">紅方先行</span></div>
      <button id="btnUndo" type="button">悔棋</button>
      <button id="btnNew" type="button">新對局</button>
      <button id="btnSound" type="button" aria-pressed="true">音效：開</button>
      <button id="btnView" type="button">視角</button>
      <button id="btnFull" type="button" aria-pressed="false">全螢幕</button>
      <a id="repoLink" href="https://github.com/doggy8088/chinese-chess" target="_blank" rel="noopener" title="在 GitHub 檢視原始碼">
        <svg viewBox="0 0 16 16" aria-hidden="true" width="15" height="15" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-2.92-.89-2.92-2.75 0-.53.19-1.07.5-1.48-.05-.12-.22-.62.05-1.29 0 0 .61-.19 2 .74a4.7 4.7 0 0 1 2.55 0c1.39-.94 2-.74 2-.74.27.67.1 1.17.05 1.29.31.41.5.94.5 1.48 0 1.87-1.14 2.55-2.93 2.75.29.25.55.74.55 1.5 0 1.08-.01 1.96-.01 2.23 0 .21.15.46.55.38A7.99 7.99 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>

  <main>
    <aside id="left">
      <section class="tray">
        <h3>紅方吃子</h3>
        <div id="capRed" class="chips"></div>
      </section>
      <section class="tray">
        <h3>黑方吃子</h3>
        <div id="capBlack" class="chips"></div>
      </section>
      <div class="help">
        <p>拖曳空白處旋轉視角</p>
        <p>滾輪 / 雙指縮放</p>
        <p>點擊己方棋子選中（亮起走法提示），再點擊目標交叉點移動；落到敵子上即為吃子。</p>
        <p>再次點擊該棋子可取消選中。</p>
      </div>
      <footer class="copyright">
        Copyright © 2026 <a href="https://www.facebook.com/will.fans/" target="_blank" rel="noopener">Will 保哥</a>
      </footer>
    </aside>

    <div id="stage"></div>

    <aside id="right">
      <h3>棋譜</h3>
      <ol id="log"></ol>
      <p id="logEmpty">尚無著法，紅方先行。</p>
    </aside>
  </main>

  <div id="checkBanner" class="hidden">將 軍 ！</div>

  <div id="overlay" class="hidden">
    <div class="card">
      <h2 id="ovTitle">紅方勝</h2>
      <p id="ovReason">將死</p>
      <button id="btnAgain" type="button">再來一局</button>
    </div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
